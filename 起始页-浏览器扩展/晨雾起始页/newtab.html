<!DOCTYPE html>
<html lang="zh-CN" data-theme="dawn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EAF0FA">
<title>起始页</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FFD9B8'/><stop offset='.5' stop-color='%23BFD7FF'/><stop offset='1' stop-color='%23D9C6F5'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='8' y='12' width='16' height='9' rx='4.5' fill='%23ffffff' opacity='.85'/><rect x='11' y='15' width='10' height='3' rx='1.5' fill='%233B62F6'/></svg>">
<script src="theme-init.js"></script>
<style>
/* ============================================================
   令牌 —— 晨雾（默认）
   ============================================================ */
:root{
  --ink:#1B2233;
  --ink-2:#5A6578;
  --mute:#8A93A5;
  --accent:#3B62F6;
  --accent-strong:#2C4ED8;
  --accent-soft:rgba(59,98,246,.12);
  --on-accent:#ffffff;
  --rule:rgba(27,34,51,.12);
  --rule-soft:rgba(27,34,51,.07);
  --glass:rgba(255,255,255,.68);
  --glass-border:rgba(255,255,255,.82);
  --glass-shadow:0 24px 50px -34px rgba(28,44,92,.6);
  --blur:16px;
  --chip:rgba(255,255,255,.52);
  --chip-border:rgba(255,255,255,.72);
  --field:rgba(255,255,255,.72);
  --field-border:rgba(27,34,51,.10);
  --hover-bg:rgba(255,255,255,.5);
  --del-hover:rgba(214,60,60,.12);
  --chk-border:rgba(27,34,51,.28);
  --placeholder:rgba(27,34,51,.42);
  --modal-bg:rgba(250,251,255,.96);
  --mask:rgba(24,30,48,.4);
  --dock-bg:rgba(255,255,255,.62);
  --dock-border:rgba(255,255,255,.8);
  --dock-active:rgba(59,98,246,.14);
  --radius:20px;
  --radius-sm:12px;
  --radius-pill:999px;
  --icon-plate:transparent;
  --grain-op:.05;
  --veil:linear-gradient(165deg,rgba(255,250,245,.48) 0%,rgba(238,244,255,.34) 50%,rgba(231,226,249,.52) 100%);
  --font:"Bahnschrift","Segoe UI Variable Text","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --font-num:"Bahnschrift","Segoe UI Variable Text","Segoe UI",-apple-system,sans-serif;
  --bg:
    radial-gradient(120% 110% at 8% -6%, #FFE7C8 0%, rgba(255,231,200,0) 55%),
    radial-gradient(100% 90% at 92% 4%, #B8D4FF 0%, rgba(184,212,255,0) 58%),
    radial-gradient(110% 95% at 46% 104%, #DCC7F7 0%, rgba(220,199,247,0) 62%),
    linear-gradient(165deg,#FBF6EE 0%,#EDF1FB 44%,#E7E9F7 100%);
}

/* 樱 */
:root[data-theme="sakura"]{
  --ink:#3B2531;
  --ink-2:#6E5661;
  --mute:#9E858F;
  --accent:#D9446E;
  --accent-strong:#BE3459;
  --accent-soft:rgba(217,68,110,.12);
  --on-accent:#ffffff;
  --rule:rgba(59,37,49,.12);
  --rule-soft:rgba(59,37,49,.07);
  --glass:rgba(255,255,255,.68);
  --glass-border:rgba(255,255,255,.85);
  --glass-shadow:0 24px 50px -34px rgba(120,60,80,.45);
  --chip:rgba(255,255,255,.56);
  --field:rgba(255,255,255,.75);
  --field-border:rgba(59,37,49,.10);
  --hover-bg:rgba(255,255,255,.55);
  --del-hover:rgba(190,52,89,.12);
  --chk-border:rgba(59,37,49,.28);
  --placeholder:rgba(59,37,49,.42);
  --modal-bg:rgba(255,250,252,.97);
  --mask:rgba(60,30,40,.38);
  --dock-bg:rgba(255,255,255,.66);
  --dock-border:rgba(255,255,255,.85);
  --dock-active:rgba(217,68,110,.16);
  --grain-op:.05;
  --veil:radial-gradient(120% 88% at 50% -12%, rgba(255,212,230,.66) 0%, rgba(255,212,230,0) 62%),linear-gradient(165deg,rgba(255,244,248,.54) 0%,rgba(255,226,238,.44) 54%,rgba(250,224,241,.58) 100%);
  --bg:
    radial-gradient(110% 100% at 6% -4%, #FFE1D6 0%, rgba(255,225,214,0) 58%),
    radial-gradient(100% 90% at 96% 6%, #FFDDE8 0%, rgba(255,221,232,0) 60%),
    radial-gradient(110% 95% at 50% 106%, #F3D7EC 0%, rgba(243,215,236,0) 62%),
    linear-gradient(165deg,#FFF7F2 0%,#FDEEF2 46%,#F8E9F3 100%);
}

/* 夜幕 */
:root[data-theme="night"]{
  --ink:#ECF3FF;
  --ink-2:#A9B7D3;
  --mute:#7B89A7;
  --accent:#6FD3F7;
  --accent-strong:#4FBEE6;
  --accent-soft:rgba(111,211,247,.16);
  --on-accent:#07131D;
  --rule:rgba(255,255,255,.14);
  --rule-soft:rgba(255,255,255,.08);
  --glass:rgba(14,20,38,.66);
  --glass-border:rgba(255,255,255,.12);
  --glass-shadow:0 28px 60px -36px rgba(0,0,0,.9);
  --blur:18px;
  --chip:rgba(255,255,255,.10);
  --chip-border:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.07);
  --field-border:rgba(255,255,255,.12);
  --hover-bg:rgba(255,255,255,.07);
  --del-hover:rgba(255,110,110,.14);
  --chk-border:rgba(220,235,255,.3);
  --placeholder:rgba(210,225,250,.4);
  --modal-bg:rgba(18,24,42,.97);
  --mask:rgba(4,6,14,.72);
  --dock-bg:rgba(18,24,42,.72);
  --dock-border:rgba(255,255,255,.14);
  --dock-active:rgba(111,211,247,.18);
  --grain-op:.04;
  --veil:linear-gradient(180deg,rgba(5,8,20,.52) 0%,rgba(8,12,30,.30) 56%,rgba(5,7,18,.56) 100%);
  --bg:
    radial-gradient(90% 80% at 10% 2%, #17396B 0%, rgba(23,57,107,0) 62%),
    radial-gradient(85% 75% at 90% 8%, #42265F 0%, rgba(66,38,95,0) 60%),
    radial-gradient(95% 80% at 52% 104%, #0C2B3E 0%, rgba(12,43,62,0) 66%),
    linear-gradient(180deg,#080B16 0%,#0B0F1E 48%,#070911 100%);
}

/* 终端 */
:root[data-theme="terminal"]{
  --ink:#C9FFDA;
  --ink-2:#82D19F;
  --mute:#54936F;
  --accent:#3BFF95;
  --accent-strong:#2AD97C;
  --accent-soft:rgba(59,255,149,.12);
  --on-accent:#04120A;
  --rule:rgba(59,255,149,.22);
  --rule-soft:rgba(59,255,149,.10);
  --glass:rgba(8,16,12,.74);
  --glass-border:rgba(59,255,149,.26);
  --glass-shadow:0 18px 40px -30px #000;
  --blur:0px;
  --chip:rgba(59,255,149,.07);
  --chip-border:rgba(59,255,149,.24);
  --field:rgba(59,255,149,.06);
  --field-border:rgba(59,255,149,.2);
  --hover-bg:rgba(59,255,149,.08);
  --del-hover:rgba(255,120,96,.14);
  --chk-border:rgba(59,255,149,.35);
  --placeholder:rgba(160,220,180,.4);
  --modal-bg:rgba(8,14,11,.97);
  --mask:rgba(2,6,4,.78);
  --dock-bg:rgba(8,14,11,.86);
  --dock-border:rgba(59,255,149,.26);
  --dock-active:rgba(59,255,149,.14);
  --radius:6px;
  --radius-sm:4px;
  --radius-pill:6px;
  --grain-op:.02;
  --veil:rgba(0,0,0,0);
  --font:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono","Sarasa Mono SC","Microsoft YaHei UI","Microsoft YaHei",monospace;
  --font-num:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
  --bg:
    radial-gradient(78% 44% at 50% -10%, rgba(59,255,149,.13) 0%, rgba(59,255,149,0) 70%),
    linear-gradient(180deg,#080C0A 0%,#050807 100%);
}

/* ============================================================
   基础
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100svh;
  color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  background-color:#EAF0FA;
  background-image:var(--bg);
  background-repeat:no-repeat;
  background-attachment:fixed;
  background-size:cover;
  transition:background-color .4s ease,color .4s ease;
}

.grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:var(--grain-op);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
  background-size:140px 140px;
}

/* 壁纸：来自免费图片 API（Picsum，按主题各一张），断网时自动退回下面的 CSS 渐变底 */
.wall{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-position:center center;background-repeat:no-repeat;background-size:cover;
  transition:opacity .8s ease;
}
:root[data-theme="dawn"] .wall{background-image:url("https://picsum.photos/id/1051/1920/1080")}
:root[data-theme="sakura"] .wall{background-image:url("https://picsum.photos/id/206/1920/1080")}
:root[data-theme="night"] .wall{background-image:url("https://picsum.photos/id/249/1920/1080")}
:root[data-theme="terminal"] .wall{background-image:none}
.wall-veil{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--veil);
}
:root[data-theme="terminal"] .grain{
  opacity:1;mix-blend-mode:normal;
  background-image:repeating-linear-gradient(180deg, rgba(59,255,149,.06) 0 1px, rgba(0,0,0,0) 1px 4px);
  background-size:auto;
}

.page{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;padding:34px 16px 84px}
.column{width:100%;max-width:1060px;margin:auto}

/* ===== 抬头：时间 + 天气 ===== */
.hero{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.hero .date{margin:0 0 4px;font-size:14px;color:var(--ink-2);letter-spacing:.02em}
.hero .clock{
  margin:0;font-size:clamp(32px,8vw,50px);line-height:.96;font-weight:600;
  font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:6px;
}
.hero .clock .sec{
  font-size:max(13px,.4em);font-weight:600;letter-spacing:.01em;
  color:var(--accent);opacity:.9;
}
.chip{
  display:inline-flex;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap;
  padding:8px 15px 8px 12px;border-radius:var(--radius-pill);
  background:var(--chip);border:1px solid var(--chip-border);
  backdrop-filter:blur(calc(var(--blur) * .6));
  -webkit-backdrop-filter:blur(calc(var(--blur) * .6));
}
.chip .w-icon{width:22px;height:22px;display:block;flex:0 0 auto}
.chip .w-icon svg{width:22px;height:22px;display:block}
.chip .w-temp{font-size:18px;font-weight:600;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.chip-div{width:1px;height:26px;background:var(--rule);flex:0 0 auto}
.w-meta{display:flex;flex-direction:column;gap:2px}
.chip .w-desc{font-size:14px;color:var(--ink-2);line-height:1.2}
.chip .w-sub{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:4px;line-height:1.2}
.city{
  font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:0;
  border-bottom:1px dashed currentColor;cursor:pointer;
}
.city:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.city-input{
  width:84px;font:inherit;font-size:13px;color:var(--ink);
  border:0;border-bottom:1px solid var(--accent);background:transparent;outline:none;padding:0;
}

/* ===== 搜索 ===== */
.find{
  position:relative;margin:26px auto 0;max-width:780px;
  display:flex;align-items:center;gap:10px;
  padding:7px 10px 7px 7px;
  border-radius:var(--radius-pill);
  background:var(--field);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  transition:border-color .25s ease,box-shadow .25s ease;
}
.find:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.switch{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);
  color:var(--on-accent);font:inherit;font-size:15px;font-weight:600;
  transition:transform .5s cubic-bezier(.34,1.3,.5,1),background-color .3s ease;
  -webkit-tap-highlight-color:transparent;
}
.switch:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.switch.turn{transform:rotate(360deg)}
#q{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  padding:10px 2px;font-family:inherit;font-size:17px;color:var(--ink);
  caret-color:var(--accent);
}
#q::placeholder{color:var(--placeholder)}
.engine-name{flex:0 0 auto;font-size:13px;color:var(--mute);padding-right:8px;white-space:nowrap}

/* ===== 分区标题 ===== */
.panel-head{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
.panel-head .tag{font-size:14px;color:var(--ink-2);letter-spacing:.06em;white-space:nowrap}
.panel-head hr{flex:1 1 auto;height:1px;margin:0;border:0;background:var(--rule)}
.link-btn{
  font:inherit;font-size:14px;color:var(--accent);background:none;border:0;
  padding:5px 10px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;
}
.link-btn:hover{background:var(--accent-soft)}
.link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 站点 ===== */
.sites-panel{
  margin-top:22px;padding:18px 14px 16px;
  border-radius:var(--radius);
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  transition:background-color .4s ease,border-color .4s ease;
}
.sites{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;position:relative;padding:2px 0}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:14px}
.tile{
  width:46px;height:46px;border:0;padding:0;border-radius:12px;
  display:grid;place-items:center;background-color:transparent;
  cursor:pointer;transition:transform .18s ease;
  -webkit-tap-highlight-color:transparent;
}
a .tile{cursor:inherit}
.glyph{
  width:38px;height:38px;border-radius:9px;overflow:hidden;
  background-repeat:no-repeat;background-position:center;background-size:38px 38px;
}
.glyph .mono{width:100%;height:100%;display:grid;place-items:center;font-size:15px;font-weight:600}
/* 真实站点图标（静态 url，发布安全） */
.i-zhihu{background-image:url("assets/zhihu_com.png")}
.i-weibo{background-image:url("assets/weibo_com.png")}
.i-bilibili{background-image:url("assets/bilibili_com.png")}
.i-xiaohongshu{background-image:url("assets/xiaohongshu_com.png")}
.i-douban{background-image:url("assets/douban_com.png")}
.i-taobao{background-image:url("assets/taobao_com.png")}
.i-jd{background-image:url("assets/jd_com.png")}
.i-feishu{background-image:url("assets/feishu_cn.png")}
.i-github{background-image:url("assets/github_com.png")}
.i-music163{background-image:url("assets/music_163_com.png")}
.i-juejin{background-image:url("assets/juejin_cn.png")}
.i-sspai{background-image:url("assets/sspai_com.png")}
/* 漆黑主题下，黑色系图标要给一层浅底，否则看不见 */
:root[data-theme="night"] .i-github,
:root[data-theme="terminal"] .i-github{background-color:#EDF1F7}
.cell:hover .tile{transform:translateY(-3px) scale(1.03)}
.cell:hover .name{opacity:1}
.name{
  font-size:13px;line-height:1.2;color:var(--ink-2);white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.empty-hint{grid-column:1 / -1;font-size:14px;color:var(--mute);margin:4px 0 0}

/* ===== 底部组件 ===== */
.panels{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
  padding:16px 16px 14px;box-shadow:var(--glass-shadow);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  transition:background-color .4s ease,border-color .4s ease;
}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
.count{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

.todo-form{display:flex;gap:8px;margin-bottom:8px}
.todo-input{
  flex:1;min-width:0;border:1px solid var(--field-border);border-radius:var(--radius-sm);
  background:var(--field);padding:9px 11px;font-family:inherit;font-size:16px;color:var(--ink);outline:none;
}
.todo-input:focus{border-color:var(--accent)}
.todo-input::placeholder{color:var(--placeholder)}
.todo-add{
  width:42px;height:42px;flex:0 0 auto;border:1px solid var(--accent);border-radius:var(--radius-sm);
  background:var(--accent);color:var(--on-accent);cursor:pointer;display:grid;place-items:center;
}
.todo-add:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.todo-add:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.todo-add svg{width:16px;height:16px}

.todo-list{list-style:none;margin:0;padding:0;max-height:160px;overflow-y:auto}
.todo-item{
  display:flex;align-items:center;gap:9px;padding:8px 2px;
  border-bottom:1px solid var(--rule-soft);cursor:pointer;border-radius:8px;
}
.todo-item:hover{background:var(--hover-bg)}
.todo-item.done .todo-text{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--rule)}
.chk{
  width:20px;height:20px;flex:0 0 auto;padding:0;
  border:1.5px solid var(--chk-border);border-radius:7px;background:none;
  display:grid;place-items:center;cursor:pointer;color:transparent;
}
.chk svg{width:13px;height:13px}
.todo-item.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.todo-text{flex:1;min-width:0;font-size:15px;line-height:1.45;word-break:break-word}
.todo-del{
  width:26px;height:26px;flex:0 0 auto;padding:0;border:0;border-radius:7px;
  background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center;
}
.todo-del:hover{color:#D2443F;background:var(--del-hover)}
.todo-del svg{width:12px;height:12px}
.empty{list-style:none;font-size:14px;color:var(--mute);padding:10px 2px}

.note{
  display:block;width:100%;min-height:120px;resize:vertical;
  border:1px solid var(--field-border);border-radius:var(--radius-sm);background:var(--field);
  padding:11px;font-family:inherit;font-size:16px;line-height:1.65;color:var(--ink);outline:none;
}
.note:focus{border-color:var(--accent)}
.note::placeholder{color:var(--placeholder)}

/* ===== 弹层 ===== */
.mask{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:var(--mask);
}
.mask[hidden]{display:none}
.panel{
  width:100%;max-width:360px;background:var(--modal-bg);border:1px solid var(--glass-border);
  border-radius:var(--radius);padding:20px 18px 16px;box-shadow:0 30px 60px -28px rgba(0,0,0,.55);
}
.panel h3{margin:0 0 14px;font-size:16px;font-weight:600}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px}
.field input{
  display:block;width:100%;border:1px solid var(--field-border);border-radius:var(--radius-sm);
  background:var(--field);padding:9px 10px;font-family:inherit;font-size:16px;color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--accent)}
.panel-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{font:inherit;font-size:15px;padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent}
.btn.ghost{background:none;border-color:var(--rule);color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover-bg)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.solid:hover{background:var(--accent-strong)}
.btn.danger{color:#C74440;border-color:var(--rule);background:none;margin-right:auto}
.btn.danger:hover{background:var(--del-hover)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 主题坞 ===== */
.dock{
  position:fixed;right:14px;bottom:14px;z-index:30;
  display:flex;align-items:center;gap:2px;padding:5px 10px 5px 6px;
  background:var(--dock-bg);border:1px solid var(--dock-border);border-radius:var(--radius-pill);
  box-shadow:0 16px 30px -22px rgba(20,30,60,.7);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
}
.sw{width:36px;height:36px;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw[aria-pressed="true"]{background:var(--dock-active)}
.sw i{display:block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dock-label{font-size:13px;color:var(--ink-2);padding-left:6px;white-space:nowrap;min-width:3em}

/* ===== 响应式 ===== */
@media (min-width:480px){
  .sites{grid-template-columns:repeat(6,1fr)}
  .tile{width:52px;height:52px}
  .glyph{width:44px;height:44px;background-size:44px 44px;border-radius:10px}
  .glyph .mono{font-size:17px}
  .name{font-size:14px}
}
@media (min-width:720px){
  .page{padding:44px 24px 92px}
  .panels{grid-template-columns:1fr 1fr;margin-top:14px}
  .sites-panel{padding:20px 18px 18px}
  .sites{gap:20px 6px}
}
@media (min-width:1024px){
  .page{padding:56px 28px 96px}
  .tile{width:56px;height:56px}
  .glyph{width:48px;height:48px;background-size:48px 48px;border-radius:11px}
  .glyph .mono{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .cell:hover .tile{transform:none}
}

/* ===== 主题细节 ===== */
:root[data-theme="dawn"] .clock{
  background:linear-gradient(100deg,#1B2233 20%,#3B62F6 60%,#7A4FD6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
:root[data-theme="sakura"] .clock{
  background:linear-gradient(100deg,#3B2531 10%,#D9446E 60%,#B25BA0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
:root[data-theme="night"] .clock{
  background:linear-gradient(100deg,#FFFFFF 10%,#6FD3F7 55%,#B78BFF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
:root[data-theme="terminal"] .clock{color:#C9FFDA;text-shadow:0 0 16px rgba(59,255,149,.4)}
:root[data-theme="terminal"] .sites-panel,
:root[data-theme="terminal"] .card,
:root[data-theme="terminal"] .find{border-radius:var(--radius)}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"></div>
<div class="wall-veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="page">
  <div class="column">

    <header class="hero">
      <div>
        <p class="date" id="date">—</p>
        <p class="clock"><span id="clock">--:--</span><span class="sec" id="sec">00</span></p>
      </div>
      <div class="chip">
        <span class="w-icon" id="wIcon" aria-hidden="true"></span>
        <span class="w-temp" id="wTemp">—</span>
        <span class="chip-div" aria-hidden="true"></span>
        <span class="w-meta">
          <span class="w-desc" id="wDesc">读取天气…</span>
          <span class="w-sub"><span id="citySlot"></span><span id="wRange"></span></span>
        </span>
      </div>
    </header>

    <form class="find" id="find" role="search" autocomplete="off">
      <button class="switch" id="switch" type="button" aria-label="切换搜索引擎，当前为必应" title="切换搜索引擎">必</button>
      <span class="engine-name" id="stampName">必应</span>
      <input id="q" type="text" name="q" placeholder="搜索，或直接输入网址" aria-label="搜索，或直接输入网址" spellcheck="false">
    </form>

    <section class="sites-panel" aria-label="常用站点">
      <div class="panel-head">
        <span class="tag">常用</span>
        <hr>
        <button class="link-btn" id="addBtn" type="button" hidden>添加</button>
        <button class="link-btn" id="editBtn" type="button">编辑</button>
      </div>
      <nav class="sites" id="grid"></nav>
    </section>

    <div class="panels">
      <section class="card" aria-labelledby="todoTitle">
        <div class="card-head">
          <h2 id="todoTitle">今日待办</h2>
          <span class="count" id="todoCount"></span>
        </div>
        <form class="todo-form" id="todoForm" autocomplete="off">
          <input class="todo-input" id="todoInput" type="text" placeholder="加一件要做的事" maxlength="60" aria-label="新增待办">
          <button class="todo-add" type="submit" aria-label="添加待办">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
          </button>
        </form>
        <ul class="todo-list" id="todoList"></ul>
      </section>

      <section class="card" aria-labelledby="noteTitle">
        <div class="card-head">
          <h2 id="noteTitle">便签</h2>
          <span class="count" id="noteHint"></span>
        </div>
        <textarea class="note" id="note" placeholder="随手记点东西，自动保存" aria-label="便签"></textarea>
      </section>
    </div>

  </div>
</div>

<div class="dock" role="group" aria-label="切换主题">
  <button class="sw" type="button" data-theme="dawn" aria-label="晨雾" aria-pressed="true"><i style="background:linear-gradient(135deg,#FFD9B8,#BFD7FF 55%,#D9C6F5)"></i></button>
  <button class="sw" type="button" data-theme="sakura" aria-label="樱" aria-pressed="false"><i style="background:linear-gradient(135deg,#FFD3DC,#F6C9E4 60%,#FFE2C9)"></i></button>
  <button class="sw" type="button" data-theme="night" aria-label="夜幕" aria-pressed="false"><i style="background:linear-gradient(135deg,#17396B,#42265F 60%,#0C2B3E)"></i></button>
  <button class="sw" type="button" data-theme="terminal" aria-label="终端" aria-pressed="false"><i style="background:#3BFF95"></i></button>
  <span class="dock-label" id="themeName">晨雾</span>
</div>

<div class="mask" id="mask" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <h3 id="panelTitle">编辑站点</h3>
    <label class="field"><span>名称</span><input id="fName" type="text" maxlength="10" placeholder="如 知乎"></label>
    <label class="field"><span>网址</span><input id="fUrl" type="text" maxlength="200" placeholder="https://www.zhihu.com"></label>
    <div class="panel-actions">
      <button class="btn danger" id="fDel" type="button" hidden>删除</button>
      <button class="btn ghost" id="fCancel" type="button">取消</button>
      <button class="btn solid" id="fSave" type="button">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
